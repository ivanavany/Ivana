<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grøntsagshavens årshjul</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <button id="menuBtn" class="menu-btn" aria-label="Menu" aria-expanded="false" aria-controls="sideMenu">☰</button>
  <div id="menuBackdrop" class="menu-backdrop" hidden></div>
  <nav id="sideMenu" class="side-menu" aria-label="Hovedmenu">
    <a href="#wheel" class="menu-item" data-page="wheel">Grøntsagshavens årshjul</a>
    <a href="#layout" class="menu-item" data-page="layout">Garden Layout</a>
  </nav>

  <header class="hero">
    <h1 id="pageTitle">Grøntsagshavens årshjul</h1>
  </header>

  <main class="wrap">

    <!-- Save / export bar -->
    <div class="savebar">
      <span id="saveStatus"></span>
      <span class="savebar-actions">
        <button id="exportBtn">Eksportér data.js</button>
        <button id="resetBtn" class="ghost">Nulstil</button>
      </span>
    </div>

    <div id="pageWheel" class="page active">
    <nav class="tabs">
      <button class="tab-btn active" data-tab="monthView">Efter måned</button>
      <button class="tab-btn" data-tab="plantView">Efter plante</button>
    </nav>

    <section id="monthView" class="panel active">
      <div class="picker" id="monthPicker"></div>
      <div class="detail" id="monthDetail"></div>
    </section>

    <section id="plantView" class="panel">
      <input type="text" id="plantSearch" placeholder="Søg efter en afgrøde…">
      <div class="picker" id="plantPicker"></div>
      <div class="detail" id="plantDetail"></div>
    </section>
    </div>

    <div id="pageLayout" class="page">
      <p class="layout-intro">12 bede (1 m brede; stierne er tegnet halvt så brede som i virkeligheden). Klik på et bed for at vælge op til 3 afgrøder.</p>
      <div class="layout-actions">
        <button id="exportLayoutBtn">Eksportér garden-data.json</button>
        <button id="importLayoutBtn" class="ghost">Importér…</button>
        <input type="file" id="importLayoutInput" accept="application/json,.json" hidden>
      </div>
      <div class="garden-scroll"><div id="gardenGrid" class="garden-grid"></div></div>
    </div>

  </main>

  <!-- Popup form for adding/editing a task -->
  <dialog id="editDialog">
    <h3 id="dialogTitle">Tilføj opgave</h3>
    <label>Måned <select id="fMonth"></select></label>
    <label>Kategori <select id="fCat"></select></label>
    <label>Afgrøde / opgave <input type="text" id="fName" placeholder="fx Grønkål"></label>
    <label>Note <textarea id="fNote" rows="3" placeholder="Valgfrit — fx sort, tidspunkt, erfaring"></textarea></label>
    <div class="dialog-actions">
      <button id="fCancel" class="ghost">Annullér</button>
      <button id="fSave">Gem</button>
    </div>
  </dialog>

  <dialog id="bedDialog">
    <h3 id="bedDialogTitle">Bed</h3>
    <label>Afgrøde 1 <select id="bedCrop1"></select></label>
    <label>Afgrøde 2 <select id="bedCrop2"></select></label>
    <label>Afgrøde 3 <select id="bedCrop3"></select></label>
    <div class="dialog-actions">
      <button id="bedCancel" class="ghost">Annullér</button>
      <button id="bedSave">Gem</button>
    </div>
  </dialog>

  <footer>
    <p id="sourceList"></p>
    <p>Klik ✎ for at redigere, ✕ for at slette, og "+ Tilføj" for nye opgaver.</p>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
